background {
    monitor =
    color = rgb(030A03)
}

input-field {
    monitor =
    size = 420, 70
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgb(39FF14)
    inner_color = rgb(071407)
    font_color = rgb(B6FF9C)
    fade_on_empty = false
    placeholder_text = <i>REACTOR AUTHENTICATION REQUIRED</i>
    hide_input = false
    check_color = rgb(39FF14)
    fail_color = rgb(FF3030)
}

label {
    monitor =
    text = $USER
    color = rgb(B6FF9C)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
